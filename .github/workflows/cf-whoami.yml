name: cf-whoami
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          H="Authorization: Bearer $T"
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/zones?name=subfixer.app" | jq '{ok: .success, acct: [.result[]?.account.name], err: .errors}'
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$A/pages/projects" | jq '{ok: .success, projects: [.result[]?.name]}'
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain" | jq '{ok: .success, sub: .result.subdomain}'
