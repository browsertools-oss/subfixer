name: cf-whoami
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          H="Authorization: Bearer $T"
          curl -s -H "$H" https://api.cloudflare.com/client/v4/accounts/$A | jq '{ok: .success, name: .result.name, err: .errors}'
          curl -s -H "$H" https://api.cloudflare.com/client/v4/user | jq '{ok: .success, email: .result.email, err: .errors}'
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$A/members?per_page=20" | jq '{ok: .success, members: [.result[]?.user.email], err: .errors}'
          curl -s -H "$H" https://api.cloudflare.com/client/v4/user/tokens/verify | jq '{ok: .success, status: .result.status}'
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts" | jq '{workersOk: .success, err: .errors}'
