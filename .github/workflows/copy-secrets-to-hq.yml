name: copy-secrets-to-hq
# One-off: copies the shared venture credentials into browsertools-oss/hq. Deleted after use.
on: workflow_dispatch
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.HQ_COPY_TOKEN }}
          A: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          C: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          printf %s "$A" | gh secret set CLAUDE_CODE_OAUTH_TOKEN -R browsertools-oss/hq
          printf %s "$B" | gh secret set CLOUDFLARE_API_TOKEN -R browsertools-oss/hq
          printf %s "$C" | gh secret set CLOUDFLARE_ACCOUNT_ID -R browsertools-oss/hq
          printf %s "$D" | gh secret set OPENROUTER_API_KEY -R browsertools-oss/hq
