name: daily-agent
on:
  # Started on time by the venture-cron Worker (subfixer repo, cron/) at 6am and 6pm Pacific.
  # GitHub's own schedule ran up to 9 hours late, so it is not used.
  workflow_dispatch:
    inputs:
      run:
        description: morning posts the daily report, evening only works
        default: morning
        type: choice
        options: [morning, evening]
permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write
concurrency: daily-agent
jobs:
  run:
    runs-on: ubuntu-latest
    # 10 agent minutes x 4 runs a day fits GitHub's 2,000 free private-repo minutes a month with deploys.
    timeout-minutes: ${{ fromJSON(vars.JOB_TIMEOUT || '22') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Live feed for the Ventures page
        # Keeps the "Agent live" check run updated with what the agent is doing.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nohup node scripts/live.mjs watch > "$RUNNER_TEMP/agent-live.log" 2>&1 &
      - id: prompt
        env:
          # Work-session length; the job timeout below must stay above it.
          AGENT_MINUTES: ${{ vars.AGENT_MINUTES || '10' }}
        run: |
          { echo 'text<<PROMPT_EOF'; sed "s/{{MINUTES}}/${AGENT_MINUTES}/g" .github/agent/daily.md; echo 'PROMPT_EOF'; } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        env:
          # OpenRouter's Anthropic-compatible endpoint. To move to Claude direct later:
          # delete these three lines and set anthropic_api_key to an Anthropic key.
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ''
          # Keep Claude Code's background calls on the same model so nothing bills elsewhere.
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.AGENT_MODEL || 'cohere/north-mini-code:free' }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.AGENT_MODEL || 'cohere/north-mini-code:free' }}
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          prompt: ${{ steps.prompt.outputs.text }}
          github_token: ${{ github.token }}
          show_full_output: true
          claude_args: >-
            --model ${{ vars.AGENT_MODEL || 'cohere/north-mini-code:free' }}
            --max-turns ${{ vars.AGENT_MAX_TURNS || '250' }}
            --allowedTools "Bash(date*),Bash(npm run build),Bash(npm test),Bash(npm install *),Bash(git *),Bash(gh issue *),Read,Edit,Write,Glob,Grep"
      - name: Commit the agent's work if tests and build pass
        if: always()
        run: |
          git config user.name "subfixer-agent"
          git config user.email "subfixer-agent@users.noreply.github.com"
          node scripts/live.mjs phase "Checking tests and build" || true
          if [ -n "$(git status --porcelain)" ]; then
            if npm test && npm run build; then
              git add -A
              git commit -qm "Agent: daily update $(date -u +%F)" && git push -q
              node scripts/live.mjs phase "Tests and build passed; pushed" || true
            else
              echo "Agent changes failed tests/build; discarded." | tee -a ops/discarded.txt
              git checkout -- . && git clean -fdq -e ops/discarded.txt
              node scripts/live.mjs phase "Tests or build failed; changes discarded" || true
            fi
          else
            node scripts/live.mjs phase "Nothing left to commit" || true
          fi
          # The agent commits each finished item; push them all once so each run deploys once.
          git push -q || true
      - name: Daily report
        # Once a day only; the evening run's commits show in the next morning's report.
        if: always() && inputs.run != 'evening'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/live.mjs phase "Writing the daily report" || true
          gh label create report --color 0E8A16 2>/dev/null || true
          gh label create decision --color D93F0B 2>/dev/null || true
          git pull --rebase -q || true
          node scripts/report.mjs
          git config user.name "subfixer-agent"
          git config user.email "subfixer-agent@users.noreply.github.com"
          git add ops/metrics.csv ops/.llm_usage_total 2>/dev/null || true
          git commit -qm "Daily metrics $(date -u +%F)" -- ops/metrics.csv ops/.llm_usage_total && git push -q || true
      - name: Close the live feed
        if: always()
        run: node scripts/live.mjs phase "Run finished" && node scripts/live.mjs finish
