name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PROJECT: subfixer
  DOMAIN: subfixer.app
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test && npm run build
      - name: Ensure the Pages project exists
        run: |
          api=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$PROJECT")
          if [ "$code" != "200" ]; then
            curl -sf -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
              -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" "$api" > /dev/null
            echo "created $PROJECT"
          fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=subfixer --branch=main
      - name: Ensure the custom domain is attached
        run: |
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          api=https://api.cloudflare.com/client/v4
          curl -s -X POST -H "$H" -H 'Content-Type: application/json' -d "{\"name\":\"$DOMAIN\"}" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" | grep -o '"success":[a-z]*' || true
          zone=$(curl -s -H "$H" "$api/zones?name=$DOMAIN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).result?.[0]?.id||""))')
          have=$(curl -s -H "$H" "$api/zones/$zone/dns_records?type=CNAME&name=$DOMAIN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).result?.length||0))')
          if [ "$have" = "0" ]; then
            curl -s -X POST -H "$H" -H 'Content-Type: application/json' \
              -d "{\"type\":\"CNAME\",\"name\":\"$DOMAIN\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true}" \
              "$api/zones/$zone/dns_records" | grep -o '"success":[a-z]*'
          fi
