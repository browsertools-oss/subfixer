name: model-probe
# Temporary: checks which free OpenRouter models can drive Claude Code's tools.
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        model:
          - thinkingmachines/inkling-2-small:free
          - recursive/flint-v1.0:free
          - xingchen-agi/xing4.0-29b-a4b:free
          - nvidia/nemotron-3.5-super-vl:free
          - dots-studio/dots-3-note-preview:free
          - nvidia/nemotron-3.5-lightning:free
          - nvidia/nemotron-3-ultra-550b-a55b:free
          - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
          - anthropic/claude-haiku-5.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Probe
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ''
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ matrix.model }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ matrix.model }}
        run: |
          mkdir -p probe
          cat > probe/check.mjs <<'JS'
          import { shiftSrt } from "./shift.mjs";
          const cases = [
            ["1\n00:00:01,000 --> 00:00:02,500\nHi\n", 1500, "1\n00:00:02,500 --> 00:00:04,000\nHi\n"],
            ["1\n00:00:00,400 --> 00:00:01,000\nA\n\n2\n00:00:02,000 --> 00:00:03,000\nB\n", -1000, "1\n00:00:01,000 --> 00:00:02,000\nB\n"],
            ["1\n00:59:59,999 --> 01:00:00,000\nX\n", 1, "1\n01:00:00,000 --> 01:00:00,001\nX\n"],
            ["1\r\n00:00:01,000 --> 00:00:02,000\r\nCRLF\r\n", 0, "1\n00:00:01,000 --> 00:00:02,000\nCRLF\n"],
            ["1\n00:00:00,500 --> 00:00:02,000\nCut\n", -1000, "1\n00:00:00,000 --> 00:00:01,000\nCut\n"],
          ];
          let ok = 0;
          for (const [inp, ms, want] of cases) { const got = shiftSrt(inp, ms); if (got === want) ok++; else console.log("FAIL", JSON.stringify(inp), ms, JSON.stringify(got)); }
          console.log(`PASSED ${ok}/${cases.length}`);
          process.exit(ok === cases.length ? 0 : 1);
          JS
          start=$(date +%s)
          timeout 420 npx -y @anthropic-ai/claude-code -p 'Write probe/shift.mjs exporting shiftSrt(text, ms): it shifts every SRT cue by ms milliseconds and returns the SRT text. Rules: accept \n or \r\n line endings and always output \n; drop a cue whose end time becomes <= 0; clamp a start time that becomes negative to 00:00:00,000; renumber cues from 1; separate cues with one blank line; end with a single \n. Run `node probe/check.mjs` and fix your code until it prints PASSED 5/5. Do not edit probe/check.mjs.' \
            --model "${{ matrix.model }}" --max-turns 30 --output-format json \
            --allowedTools "Bash(node probe/check.mjs),Read,Write,Edit" > out.json 2> err.txt || true
          secs=$(( $(date +%s) - start ))
          git checkout -- probe/check.mjs 2>/dev/null || true
          checked=$(node probe/check.mjs 2>&1 | tail -1)
          node -e '
            const fs=require("fs"); let o={}; try{o=JSON.parse(fs.readFileSync("out.json","utf8"))}catch{}
            console.log("PROBE_RESULT", JSON.stringify({model:process.argv[1], secs:+process.argv[2], checked:process.argv[3], turns:o.num_turns, error:o.is_error, result:(o.result||"").slice(-120), stderr:fs.readFileSync("err.txt","utf8").replace(/.*unrecognized_model.*\n?/g,"").slice(-200)}))
          ' "${{ matrix.model }}" "$secs" "$checked"
